name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Invariant gates (threat model)
        shell: pwsh
        run: |
          # NATIVE_BRIDGE.md invariant 1: no host objects are ever exposed to pages.
          $hits = Get-ChildItem src -Recurse -Include *.cs | Select-String -Pattern 'AddHostObjectToScript'
          if ($hits) { $hits | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }; exit 1 }
          # AI_POLICY.md: keys never live in the repo.
          # The scanner itself and docs are excluded; everything else in the tree is checked.
          $keys = Get-ChildItem -Recurse -File -Exclude *.md | Where-Object { $_.FullName -notmatch '\\(artifacts|\.git|\.github)\\' } | Select-String -Pattern '(sk-or-v1-|OPENROUTER_API_KEY\s*=\s*\S{10,}|JEV_API_KEY\s*=\s*\S{10,})'
          if ($keys) { $keys | ForEach-Object { Write-Error "possible secret: $($_.Path):$($_.LineNumber)" }; exit 1 }
          Write-Host "invariant gates passed"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Idle-benchmark rules (self-test, made-up numbers)
        shell: powershell
        run: ./scripts/idle-benchmark.selftest.ps1

      - name: Restore
        run: dotnet restore

      - name: Unit tests
        run: dotnet test --no-restore --nologo --logger trx --results-directory artifacts/testresults

      - name: Build shell (x64, unpackaged)
        run: dotnet build src/JevBrowse.App -c Release -p:Platform=x64 --no-restore --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/testresults/*.trx

  # Performance CI (Architecture §22). Runs the measured benchmarks and publishes the raw JSON. It is informational
  # until a stable benchmark machine exists; hosted runners vary too much to gate on absolute numbers.
  perf:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained shell
        run: dotnet publish src/JevBrowse.App -c Release -r win-x64 -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -o out/app --nologo
      - name: Run benchmarks
        shell: pwsh
        env:
          JEVBROWSE_DATA_DIR: ${{ github.workspace }}\out\data
          JEVBROWSE_NO_FILTER_UPDATE: '1'
        run: |
          $exe = "out/app/JevBrowse.App.exe"
          foreach ($mode in '--memory-lab', '--restore-bench') {
            $p = Start-Process $exe -ArgumentList $mode -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; Write-Warning "$mode timed out" }
          }
          Get-ChildItem out/data/benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: out/data/benchmarks/*.json

  # Idle CPU (docs/performance/IDLE_CPU.md). REPORT ONLY: it never fails the build and never blocks a merge. A hosted runner has no
  # real desktop guarantees and a different machine every time, so a run may come back INCONCLUSIVE, which is the correct answer, not an error.
  # Regression enforcement needs a stable dedicated runner and a threshold chosen from that runner's own run-to-run variation.
  idle-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained shell
        run: dotnet publish src/JevBrowse.App -c Release -r win-x64 -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -o out/app --nologo
      - name: Measure idle CPU (report only)
        shell: powershell
        continue-on-error: true
        run: ./scripts/idle-benchmark.ps1 -Scenarios "static,panel-open,panel-closed,agent-idle,busy-control" -Runs 3 -WarmupSeconds 20 -SampleSeconds 40 -ExePath "$env:GITHUB_WORKSPACE/out/app/JevBrowse.App.exe" -Root "$env:RUNNER_TEMP/idle" -Label ci -ReportOnly -MaxMinutes 18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-cpu
          path: ${{ runner.temp }}/idle/**
          if-no-files-found: warn

  # Real-app recovery (docs/adr/0031): kill the app with a live Private session, close it normally, start it on a damaged database. REPORT ONLY: it needs an
  # interactive desktop and python, which a hosted runner may not give it; an inconclusive result there is expected and never blocks a merge.
  recovery-app:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained shell
        run: dotnet publish src/JevBrowse.App -c Release -r win-x64 -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -o out/app --nologo
      - name: Recovery check (report only)
        shell: powershell
        continue-on-error: true
        run: ./scripts/recovery-check.ps1 -Scenario all -ExePath "$env:GITHUB_WORKSPACE/out/app/JevBrowse.App.exe" -Root "$env:RUNNER_TEMP/recovery"
      - name: Navigation check on the real engine (report only)
        shell: powershell
        continue-on-error: true
        run: |
          $d = "$env:RUNNER_TEMP/navcheck"; New-Item -ItemType Directory "$d/benchmarks" -Force | Out-Null
          '{"firstRunDone":true}' | Set-Content "$d/settings.json" -Encoding ascii
          $env:JEVBROWSE_DATA_DIR = $d; $env:JEVBROWSE_NO_FILTER_UPDATE = '1'; $env:JEVBROWSE_AI = '0'
          $p = Start-Process "$env:GITHUB_WORKSPACE/out/app/JevBrowse.App.exe" -ArgumentList '--nav-check' -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; Write-Warning 'nav-check timed out' }
          if (Test-Path "$d/benchmarks/nav-check.json") { $j = Get-Content "$d/benchmarks/nav-check.json" -Raw | ConvertFrom-Json; "nav-check pass: $($j.pass)"; $j.steps | ForEach-Object { "{0} {1} {2}" -f $(if ($_.ok) { 'PASS' } else { 'FAIL' }), $_.name, $_.detail } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nav-check
          path: ${{ runner.temp }}/navcheck/benchmarks/nav-check.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-app
          path: ${{ runner.temp }}/recovery/**/recovery-result.json
          if-no-files-found: warn
